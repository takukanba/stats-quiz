<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ツール一覧 | こどもの行動相談室</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');

  :root{
    --sand:    #F6F2EA;
    --sand-2:  #EFE8DA;
    --ink:     #2F3A33;
    --moss:    #5C7A63;
    --moss-d:  #3F5945;
    --clay:    #B98A63;
    --line:    #DAD2C0;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    background:var(--sand);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  /* ambient texture */
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      radial-gradient(circle at 12% 18%, rgba(92,122,99,0.07), transparent 40%),
      radial-gradient(circle at 88% 82%, rgba(185,138,99,0.08), transparent 45%);
    pointer-events:none;
  }

  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:64px 24px 80px;
    position:relative;
  }

  header{
    margin-bottom:56px;
  }

  .eyebrow{
    font-size:12px;
    letter-spacing:0.28em;
    color:var(--moss-d);
    text-transform:uppercase;
    margin-bottom:14px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .eyebrow::before{
    content:"";
    width:18px; height:1px;
    background:var(--clay);
    display:inline-block;
  }

  h1{
    font-family:'Shippori Mincho', serif;
    font-size:clamp(28px, 6vw, 38px);
    font-weight:700;
    line-height:1.5;
    color:var(--moss-d);
    letter-spacing:0.02em;
  }

  .lead{
    margin-top:18px;
    font-size:14.5px;
    line-height:1.9;
    color:#5C6760;
    max-width:46ch;
  }

  .list{
    display:flex;
    flex-direction:column;
    border-top:1px solid var(--line);
  }

  .card{
    display:flex;
    align-items:center;
    gap:18px;
    padding:24px 6px;
    border-bottom:1px solid var(--line);
    text-decoration:none;
    color:inherit;
    position:relative;
    transition:padding-left 0.25s ease, background 0.25s ease;
  }

  .card:hover, .card:focus-visible{
    padding-left:14px;
    background:rgba(92,122,99,0.05);
    outline:none;
  }
  .card:focus-visible{
    box-shadow:inset 2px 0 0 var(--moss);
  }

  .mark{
    font-family:'Shippori Mincho', serif;
    font-size:13px;
    color:var(--clay);
    letter-spacing:0.06em;
    width:34px;
    flex-shrink:0;
  }

  .meta{
    flex:1;
    min-width:0;
  }

  .card-title{
    font-size:17px;
    font-weight:700;
    color:var(--moss-d);
    margin-bottom:5px;
    letter-spacing:0.01em;
  }

  .card-desc{
    font-size:13px;
    color:#74807A;
    line-height:1.7;
  }

  .arrow{
    font-size:18px;
    color:var(--clay);
    flex-shrink:0;
    transform:translateX(0);
    transition:transform 0.25s ease;
  }
  .card:hover .arrow, .card:focus-visible .arrow{
    transform:translateX(4px);
  }

  footer{
    margin-top:64px;
    padding-top:24px;
    border-top:1px solid var(--line);
    font-size:12px;
    color:#8A9189;
    letter-spacing:0.04em;
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
  }

  @media (prefers-reduced-motion: reduce){
    .card, .arrow{ transition:none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow">こどもの行動相談室</div>
      <h1>ツール一覧</h1>
      <p class="lead">PFA・統計学習・研究法の実践ツールをまとめています。使いたいツールを選んでください。</p>
    </header>

    <nav class="list">
      <a class="card" href="research.html">
        <span class="mark">01</span>
        <span class="meta">
          <span class="card-title">心理学研究法クイズ</span>
          <span class="card-desc">「心理学研究法」の理解度確認クイズ</span>
        </span>
        <span class="arrow">→</span>
      </a>

      <a class="card" href="statistics.html">
        <span class="mark">02</span>
        <span class="meta">
          <span class="card-title">心理学統計法クイズ</span>
          <span class="card-desc">相関・分散分析・検定など統計の演習問題</span>
        </span>
        <span class="arrow">→</span>
      </a>
    </nav>

    <footer>
      <span>神庭拓也</span>
      <span><a href="pfa-app.html" style="color:inherit; text-decoration:none; opacity:0.55;">こどもの行動相談室</a></span>
    </footer>
  </div>
</body>
</html>
